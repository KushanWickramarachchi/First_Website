<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- Header (reuse your existing styles) -->
  <div class="header">
    <div class="logo">KW</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projectpage.html">Project</a></li>
      <li><a href="manufacturing.html">Manufacturing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>

  <!-- Contact Container -->
  <div class="contact-container">

    <h1 class="contact-title">Contact</h1>

    <!-- Top Section -->
    <div class="contact-top">

      <!-- Social Links -->
      <div class="social-links">
        <a href="#" class="social-btn">LinkedIn</a>
        <a href="#" class="social-btn">Instagram</a>
        <a href="#" class="social-btn">GitHub</a>
      </div>

      <!-- Profile Image -->
      <div class="profile-image">
        <img src="images/Portfolio Picture.jpg" alt="Profile">
      </div>

    </div>

    <!-- Email Form -->
    <h2 class="email-title">Send Me an Email</h2>

    <form class="contact-form">

        <div class="form-left">
          <label>Name</label>
          <input type="text" name="name" required>
      
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
      
        <div class="form-right">
          <label>Message</label>
          <textarea name="message" required></textarea>
        </div>
      
        <div class="form-button">
          <button type="submit" class="send-btn">submit</button>
        </div>
      
      </form>

  </div>

</body>
</html>
